- name: "Neovim | {{ ansible_distribution }} | Dependencies"
  community.general.homebrew:
    name:
      - cmake
      - curl
      - pkg-config
      - libtool
      - unzip
      - ripgrep
      - tree-sitter-cli
    state: present

- name: "Neovim | {{ ansible_distribution }} | Install"
  community.general.homebrew:
    name: neovim
    state: present