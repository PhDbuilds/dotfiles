- name: "Neovim | Debian-family | Dependencies"
  ansible.builtin.apt:
    name:
      - cmake
      - curl
      - pkg-config
      - libtool
      - unzip
      - ripgrep
      - software-properties-common
    state: present
  become: true

- name: "Neovim | Debian-family | Add official Neovim PPA"
  ansible.builtin.apt_repository:
    repo: ppa:neovim-ppa/unstable
    state: present
    update_cache: true
  become: true

- name: "Neovim | Debian-family | Install latest Neovim"
  ansible.builtin.apt:
    name: neovim
    state: latest
  become: true

# nvim-treesitter's `main` branch compiles parsers with the tree-sitter CLI,
# which isn't packaged in apt — install the prebuilt binary from GitHub releases.
- name: "Neovim | Debian-family | Install tree-sitter CLI"
  ansible.builtin.shell:
    cmd: >
      set -o pipefail &&
      curl -fsSL https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-linux-x64.gz
      | gunzip -c > /usr/local/bin/tree-sitter &&
      chmod 0755 /usr/local/bin/tree-sitter
    creates: /usr/local/bin/tree-sitter
  args:
    executable: /bin/bash
  become: true

